name: Stale

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            ⚠️ This issue has been marked as stale because it hasn't had activity
            in 60 days. It will be closed in 14 days if there's no further activity.
          stale-pr-message: >
            ⚠️ This PR has been marked as stale because it hasn't had activity
            in 60 days. It will be closed in 14 days if there's no further activity.
          close-issue-message: >
            🔒 Closing this issue as stale. Feel free to reopen if it's still relevant.
          close-pr-message: >
            🔒 Closing this PR as stale. Feel free to reopen if it's still relevant.
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
