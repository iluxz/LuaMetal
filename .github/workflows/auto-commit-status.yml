name: Update build status

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Update status file
        run: |
          cat > .github/build-status.json << EOF
          {
            "last_commit": "${{ github.event.workflow_run.head_sha }}",
            "conclusion": "${{ github.event.workflow_run.conclusion }}",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-status.json
          git diff --staged --quiet || git commit -m "chore: update build status [skip ci]"
          git push
